name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  SOLUTION_FILE_PATH: CI-CD-PipelineBasic.slnx
  BUILD_CONFIGURATION: Release
  BUILD_PLATFORM: x64

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore ${{ env.SOLUTION_FILE_PATH }}

      - name: Build solution
        run: >
          msbuild ${{ env.SOLUTION_FILE_PATH }}
          /p:Configuration=${{ env.BUILD_CONFIGURATION }}
          /p:Platform=${{ env.BUILD_PLATFORM }}
          /m

      - name: Run GoogleTest binaries
        shell: pwsh
        run: |
          $testExes = Get-ChildItem -Path . -Recurse -Filter "*.exe" | 
            Where-Object { $_.FullName -like "*Release*" -and $_.Name -match "Test" } | 
            Select-Object -ExpandProperty FullName
          
          if (-not $testExes) {
            Write-Error "No test executable found in Release directory!"
            exit 1
          }
          
          foreach ($test in $testExes) {
            Write-Host "Running: $test"
            & $test
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Tests failed in $test"
              exit $LASTEXITCODE
            }
          }